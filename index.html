<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('themeMode');
          if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#c85a32" />

    <!-- Primary Meta Tags -->
    <title>%VITE_APP_TITLE% - Free Bible Study Question Generator & Outline Builder</title>
    <meta name="title" content="%VITE_APP_TITLE% - Free Bible Study Question Generator & Outline Builder" />
    <meta name="description" content="Format, organize, search, and export Bible study discussion questions and outlines in seconds. Perfect for small group leaders, pastors, and Scripture lesson planning." />
    <meta name="keywords" content="Bible study generator, Bible study question builder, Passage Prep, Scripture study outlines, Genesis John Romans study questions, small group discussion prompts, free Bible lesson planner, Christian curriculum tool" />
    <meta name="author" content="%VITE_APP_TITLE%" />

    <!-- Open Graph / Facebook -->

    <meta property="og:url" content="%VITE_APP_URL%/" />
